# Preview deploy to GitHub Pages (https://orinavot.github.io/house-website/).
# Builds the Astro site, then flattens it to relative paths with
# scripts-preview-bundle.py so it works under the /house-website/ sub-path.
# Marked noindex: this is a review copy, not the live site.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Flatten to relative paths
        run: python3 scripts-preview-bundle.py _site > /dev/null
      - name: Mark preview as noindex
        run: sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' _site/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
